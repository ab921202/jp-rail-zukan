<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本鐵道車輛圖鑑</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>日本鐵道車輛圖鑑</h1>
    <p class="subtitle">收錄新幹線、通勤型與特急型的日本鐵道車輛資料</p>
  </header>

  <main>
    <div class="filter-bar" id="filter-bar" role="group" aria-label="車輛分類篩選"></div>
    <div class="car-grid" id="car-grid"></div>
  </main>

  <footer>
    <p>© 日本鐵道車輛圖鑑</p>
  </footer>

  <script src="assets/data.js"></script>
  <script>
    (function () {
      const filterBar = document.getElementById("filter-bar");
      const carGrid = document.getElementById("car-grid");
      const categories = typeof CATEGORIES !== "undefined" ? CATEGORIES : {};
      const cars = typeof CARS !== "undefined" ? CARS : [];
      let currentCategory = "all";

      function createFilterButton(key, label, isActive) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = isActive ? "filter-btn active" : "filter-btn";
        button.dataset.category = key;
        button.textContent = label;
        button.addEventListener("click", function () {
          currentCategory = key;
          updateActiveButton();
          renderCars();
        });
        return button;
      }

      function updateActiveButton() {
        const buttons = filterBar.querySelectorAll(".filter-btn");
        buttons.forEach(function (btn) {
          if (btn.dataset.category === currentCategory) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });
      }

      function renderFilters() {
        filterBar.innerHTML = "";
        filterBar.appendChild(createFilterButton("all", "全部", true));

        Object.keys(categories).forEach(function (key) {
          const categoryInfo = categories[key];
          const label = categoryInfo && categoryInfo.label ? categoryInfo.label : key;
          filterBar.appendChild(createFilterButton(key, label, false));
        });
      }

      function renderCars() {
        carGrid.innerHTML = "";

        const filteredCars = currentCategory === "all"
          ? cars
          : cars.filter(function (car) {
              return car.category === currentCategory;
            });

        if (filteredCars.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.className = "empty-message";
          emptyMessage.textContent = "目前沒有符合的車型";
          carGrid.appendChild(emptyMessage);
          return;
        }

        filteredCars.forEach(function (car) {
          const card = document.createElement("a");
          card.className = "car-card";
          card.href = "cars/" + car.id + ".html";

          const colorBlock = document.createElement("div");
          colorBlock.className = "car-card-color"; /* 對齊 style.css */
          colorBlock.textContent = car.nameJa;
          colorBlock.style.backgroundColor = car.color;

          const body = document.createElement("div");
          body.className = "car-card-body"; /* 對齊 style.css */

          const title = document.createElement("h3"); /* 改用 h3 */
          title.className = "car-card-title"; /* 對齊 style.css */
          title.textContent = car.name;

          const meta = document.createElement("div");
          meta.className = "car-card-meta"; /* 對齊 style.css */

          const categoryBadge = document.createElement("span");
          categoryBadge.className = "category-badge"; /* 對齊 style.css */
          const categoryData = categories[car.category];
          categoryBadge.textContent = categoryData && categoryData.label ? categoryData.label : car.category;

          const operator = document.createElement("span");
          operator.className = "car-card-operator"; /* 對齊 style.css */
          operator.textContent = car.operator;

          meta.appendChild(categoryBadge);
          meta.appendChild(operator);

          body.appendChild(title);
          body.appendChild(meta);

          card.appendChild(colorBlock);
          card.appendChild(body);

          carGrid.appendChild(card);
        });
      }

      renderFilters();
      renderCars();
    })();
  </script>
</body>
</html>
